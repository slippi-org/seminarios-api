[project]
name = "seminarios-api"
version = "0.1.0"
description = "Authenticated event/note log for the Seminarios campaign map"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import `tests.conftest`; keep the repo root importable regardless of
# how the venv was synced (uv run vs. uv pip install -e).
pythonpath = ["."]
filterwarnings = [
    "error::DeprecationWarning",
    # anyio's own lazy-import shim, triggered by starlette's TestClient.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.routes"]

[tool.setuptools.package-data]
app = ["schema.sql"]
