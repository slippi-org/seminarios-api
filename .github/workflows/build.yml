name: build

# Publishes ghcr.io/slippi-org/seminarios-api so the Pi does `compose pull` like every
# other service, instead of building from its own checkout (~3.5 min on a Pi 5).
# The image carries no secrets: configuration is environment variables and the database
# is a bind mount (PLAN.md §8).

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - LICENSE
      - .gitignore
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv && uv pip install -e '.[dev]'
      - run: uv run pytest -q

  image:
    # The Pi is aarch64, so build natively on an arm64 runner -- free for public repos,
    # and far faster than QEMU. If this label is ever unavailable the job fails before
    # it starts; the fallback is `runs-on: ubuntu-latest` plus
    # `uses: docker/setup-qemu-action@v3` ahead of the build step.
    runs-on: ubuntu-24.04-arm
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `latest` is what the compose file follows; the sha tag is what you pin to when
      # rolling back (`image: ...@sha256:...` or `:sha-<commit>`).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
